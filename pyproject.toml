[project]
name = "sixaxis"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"sixaxis/urdf.py" = ["E501"]
"sixaxis/commands.py" = ["E501"]
"scripts/*.py" = ["E501"]
